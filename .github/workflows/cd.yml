name: CD (Artifact Packaging)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger

jobs:
  package:
    name: Package Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Backend Packaging
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend
        run: dotnet restore Backend/SyntInfo.sln

      - name: Publish Backend
        run: dotnet publish Backend/SyntInfo.Api/SyntInfo.Api.csproj --configuration Release --output ./publish/backend --no-restore

      # Frontend Packaging
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build -- --output-path=../publish/frontend

      # Artifact Upload
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syntinfo-full-package
          path: ./publish
          retention-days: 7
