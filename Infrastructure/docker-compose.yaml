services:
  db:
    image: pgvector/pgvector:pg16
    container_name: syntinfo_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: synt_user
      POSTGRES_PASSWORD: synt_password
      POSTGRES_DB: syntinfo_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: syntinfo_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@syntinfo.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    restart: always

volumes:
  pgdata:
